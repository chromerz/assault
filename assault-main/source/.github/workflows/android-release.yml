name: Android release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish'
        required: true
        default: 'v2.11.2'
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the retired SDK package "tools".
          packages: 'platform-tools'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a stable semantic version'
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package.json'
          for module in ('manager', 'loader'):
              source = Path(f'android/{module}/build.gradle').read_text()
              assert re.search(r"versionName\s+'" + re.escape(version) + "'", source), f'{module} versionName mismatch'
          PY
      - name: Restore release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSAULT_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ASSAULT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "Restore the existing release signing secrets before publishing updates."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manager.p12"
          echo "ASSAULT_KEYSTORE_PATH=$RUNNER_TEMP/manager.p12" >> "$GITHUB_ENV"
      - name: Build and lint every APK variant
        env:
          ASSAULT_KEYSTORE_PATH: ${{ env.ASSAULT_KEYSTORE_PATH }}
          ASSAULT_SIGNING_PASSWORD: ${{ secrets.ASSAULT_SIGNING_PASSWORD }}
        run: |
          trap 'rm -f "$ASSAULT_KEYSTORE_PATH"' EXIT
          python3 scripts/build_android.py --all-variants
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test custom runtime and download portal
        run: |
          npm ci
          npm test
          npm run build
      - name: Collect signed release APKs
        run: |
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          manager = json.loads(Path('public/releases/manifest.json').read_text())['manager']
          name = Path(manager['url']).name
          if name != f"Assault-Manager-{manager['sha256']}.apk":
              raise SystemExit('Manifest must identify the content-hashed Manager APK')
          data = (Path('public/releases') / name).read_bytes()
          if len(data) != manager['size'] or hashlib.sha256(data).hexdigest() != manager['sha256']:
              raise SystemExit('Manager APK does not match the published manifest')
          Path('release').mkdir(exist_ok=True)
          Path('release/Assault-Manager.apk').write_bytes(data)
          PYTHON
          cp android/loader/build/outputs/apk/release/loader-release.apk release/Assault-Loader.apk
          python3 scripts/pack_release_artifacts.py --output-dir release
          cd release
          sha256sum -- *.apk *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.apk release/*.zip release/SHA256SUMS --verify-tag \
            --title "Assault $RELEASE_TAG" --notes-file docs/release-notes.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/manager.p12"
