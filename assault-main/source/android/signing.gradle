// Release signing material is supplied by the build script, never stored in Git.
android {
    signingConfigs {
        release {
            def location = System.getenv('ASSAULT_KEYSTORE_PATH')
            if (location != null) {
                storeFile file(location)
                storePassword System.getenv('ASSAULT_SIGNING_PASSWORD')
                keyAlias 'assault'
                keyPassword System.getenv('ASSAULT_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// AGP omits validateSigningRelease entirely when no keystore is configured.
// Check before any release work, even for a direct Gradle invocation.
def requireReleaseSigning = tasks.register('requireReleaseSigning') {
    doLast {
        def location = System.getenv('ASSAULT_KEYSTORE_PATH')
        def password = System.getenv('ASSAULT_SIGNING_PASSWORD')
        if (!location || !password || !file(location).isFile()) {
            throw new GradleException('Release signing requires ASSAULT_KEYSTORE_PATH and ASSAULT_SIGNING_PASSWORD. Use python3 scripts/build_android.py for persistent local signing.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn requireReleaseSigning
}
